<div class="qr-scanner-container">
    <video #videoEl autoplay playsinline muted style="width:100%; display:block; max-height:320px; object-fit:cover">
    </video>
    <canvas #canvasEl style="display:none"></canvas>

    <!-- Overlay -->
    <div class="qr-overlay">
        <div class="qr-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
            <div class="scan-line"></div>
        </div>
    </div>

    <!-- Controles -->
    <div class="qr-controls">
        <span class="qr-hint">{{ hint }}</span>
        <div class="d-flex gap-2">
            @if (torchSupported) {
            <button class="btn btn-sm btn-light" (click)="toggleTorch()">
                <i class="bi" [class.bi-lightbulb-fill]="torchOn" [class.bi-lightbulb]="!torchOn"></i>
            </button>
            }
            @if (hasMultipleCameras) {
            <button class="btn btn-sm btn-light" (click)="switchCamera()">
                <i class="bi bi-arrow-repeat"></i>
            </button>
            }
        </div>
    </div>
</div>
